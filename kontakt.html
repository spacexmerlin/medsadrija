<body>

<header class="site-header">
  <a href="index.html" class="logo">MEDSADRIJA.</a>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>

      <span></span><span></span><span></span>
    </button>
  </nav>
</header>

<main>
  <div class="page-head">
    <span class="eyebrow">Kontakt</span>
    <h1>Kontakt</h1>
  </div>

  <section class="section reveal">
    <div class="container contact-grid">
      <div>
        <div class="contact-block">
          <h3>Booking &amp; Anfragen</h3>
          <a href="mailto:booking@medsadrija.live">booking@medsadrija.live</a>
        </div>
        <div class="contact-block">
          <h3>Presse</h3>
          <a href="mailto:presse@medsadrija.live">presse@medsadrija.live</a>
        </div>
        <div class="contact-block">
          <h3>Socials</h3>
          <div class="social-row" style="margin-top:6px;">
            <a href="#" aria-label="Instagram"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/></svg></a>
            <a href="#" aria-label="YouTube"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="4" stroke="currentColor" stroke-width="1.6"/><path d="M10 9.5L15 12L10 14.5V9.5Z" fill="currentColor"/></svg></a>
            <a href="#" aria-label="Spotify"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/><path d="M7 10.5C10 9.3 15 9.6 17 11.5M7.5 13.5C10 12.7 14 12.9 16 14.3M8 16.3C10 15.7 13 15.8 14.5 16.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></a>
          </div>
        </div>
      </div>

      <form class="contact-form" novalidate>
        <div class="form-row">
          <div class="field">
            <input type="text" name="name" placeholder="Name" required>
          </div>
          <div class="field">
            <input type="email" name="email" placeholder="E-Mail" required>
          </div>
        </div>
        <div class="field">
          <textarea name="message" placeholder="Nachricht" required></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn--primary">
            Absenden
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 11L11 3M11 3H4M11 3V10" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <span class="form-status" role="status"></span>
        </div>
      </form>
    </div>
  </section>
</main>
